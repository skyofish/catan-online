<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{PLATFORM_NAME}}</title>
<meta name="description" content="和朋友一起玩的私人游戏厅。">
<meta name="theme-color" content="#16302a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="游戏厅">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="stylesheet" href="/css/hub.css">
</head>
<body data-state="loading">

<!-- 招牌：平台名称竖排 -->
<header class="sign" aria-label="{{PLATFORM_NAME}}">
  <span class="sign-lamp" aria-hidden="true"></span>
  <h1 class="sign-name">{{PLATFORM_NAME}}</h1>
  <span class="sign-open" id="sign-open">营业中</span>
</header>

<main class="room">
  <!-- 未登录 -->
  <section id="view-login" class="view" hidden>
    <form id="login-form" class="door" autocomplete="on">
      <h2>报上名来</h2>
      <p class="hint">输入管理员为你开通的账号，不需要密码。</p>
      <div class="door-row">
        <input id="login-name" maxlength="16" autocomplete="username" placeholder="你的账号" aria-label="账号" required>
        <button class="btn primary" id="btn-login" type="submit">进门</button>
      </div>
      <p id="login-error" class="form-error" role="alert" hidden></p>
    </form>
    <p class="shelf-caption">柜子里有</p>
    <ul class="shelf preview" id="shelf-preview" aria-label="游戏"></ul>
  </section>

  <!-- 已登录 -->
  <section id="view-hall" class="view" hidden>
    <div class="hall-top">
      <div>
        <p class="greet" id="greet"></p>
        <p class="online" id="online"></p>
      </div>
      <div class="hall-btns"><button class="btn ghost fs-hub" type="button" data-fullscreen aria-label="全屏"></button><button class="btn ghost" id="btn-logout">退出登录</button></div>
    </div>
    <ul class="shelf" id="shelf" aria-label="选择游戏"></ul>
  </section>
</main>

<div id="invite-root" aria-live="polite"></div>
<div id="toast-root" aria-live="polite"></div>

<script type="module" src="/js/hub.js"></script>
</body>
</html>
