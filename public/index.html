<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>卡坦岛 在线版</title>
<meta name="description" content="网页版卡坦岛：4 / 6 / 8 人地图，好友联机，支持电脑玩家。">
<meta name="theme-color" content="#0b3f4a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-screen="loading">

<!-- 全局图标与渐变（不能 display:none，否则部分浏览器的渐变失效） -->
<svg class="defs" width="0" height="0" aria-hidden="true">
  <defs>
    <linearGradient id="g-forest" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f8a47"/><stop offset="1" stop-color="#22562b"/></linearGradient>
    <linearGradient id="g-pasture" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6d468"/><stop offset="1" stop-color="#6fa83f"/></linearGradient>
    <linearGradient id="g-fields" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4d468"/><stop offset="1" stop-color="#d9a838"/></linearGradient>
    <linearGradient id="g-hills" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d98a58"/><stop offset="1" stop-color="#ac5530"/></linearGradient>
    <linearGradient id="g-mountains" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a4abb6"/><stop offset="1" stop-color="#6c7480"/></linearGradient>
    <linearGradient id="g-desert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0dca8"/><stop offset="1" stop-color="#d9bd7f"/></linearGradient>
    <radialGradient id="g-token" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fff8e4"/><stop offset="1" stop-color="#e8d6a8"/></radialGradient>
    <clipPath id="hexclip"><polygon points="0,-58 50.2,-29 50.2,29 0,58 -50.2,29 -50.2,-29"/></clipPath>

    <!-- 资源图标 -->
    <symbol id="i-wood" viewBox="0 0 32 32"><rect x="14.5" y="23" width="3" height="6" rx="1" fill="#6b4423"/><polygon points="16,3 6,16 11,16 4,24 28,24 21,16 26,16" fill="#2f7a3a"/><polygon points="16,3 6,16 11,16 4,24 16,24" fill="#3e9a4b"/></symbol>
    <symbol id="i-brick" viewBox="0 0 32 32"><g stroke="#6e2a12" stroke-width="1.2"><rect x="3" y="19" width="12" height="7" rx="1" fill="#cf6a3c"/><rect x="17" y="19" width="12" height="7" rx="1" fill="#b9562c"/><rect x="9" y="11" width="13" height="7" rx="1" fill="#de7b4a"/><rect x="12" y="4" width="9" height="6" rx="1" fill="#c45e33"/></g></symbol>
    <symbol id="i-sheep" viewBox="0 0 32 32"><g fill="#fdfcf5" stroke="#b9b6a3" stroke-width=".8"><circle cx="11" cy="15" r="5"/><circle cx="17" cy="12" r="5.5"/><circle cx="21" cy="17" r="5"/><circle cx="14" cy="19" r="5"/></g><ellipse cx="25.5" cy="12" rx="3.2" ry="4" fill="#33302c"/><g stroke="#33302c" stroke-width="2" stroke-linecap="round"><line x1="12" y1="23" x2="12" y2="28"/><line x1="20" y1="22" x2="20" y2="28"/></g></symbol>
    <symbol id="i-wheat" viewBox="0 0 32 32"><g stroke="#8a5c12" stroke-width="1.4" stroke-linecap="round"><line x1="16" y1="29" x2="16" y2="9"/><line x1="16" y1="29" x2="9" y2="12"/><line x1="16" y1="29" x2="23" y2="12"/></g><g fill="#f2c94c" stroke="#b07f18" stroke-width=".7"><ellipse cx="16" cy="7" rx="2.6" ry="5"/><ellipse cx="8.5" cy="10" rx="2.3" ry="4.4" transform="rotate(-22 8.5 10)"/><ellipse cx="23.5" cy="10" rx="2.3" ry="4.4" transform="rotate(22 23.5 10)"/></g><path d="M11 22 h10" stroke="#b07f18" stroke-width="2.4"/></symbol>
    <symbol id="i-ore" viewBox="0 0 32 32"><polygon points="4,26 10,12 17,9 23,14 28,26" fill="#6f7884"/><polygon points="10,12 17,9 15,18 8,20" fill="#9aa3ae"/><polygon points="17,9 23,14 21,20 15,18" fill="#828b97"/><polygon points="15,18 21,20 28,26 4,26 8,20" fill="#596270"/><polygon points="19,5 22,8 20,11 17,8" fill="#7fd0e6" stroke="#3c8aa0" stroke-width=".6"/></symbol>
    <symbol id="i-resback" viewBox="0 0 32 32"><rect x="7" y="4" width="18" height="24" rx="3" fill="#e0a93b" stroke="#7a5320" stroke-width="1.5"/><rect x="10" y="7" width="12" height="18" rx="2" fill="none" stroke="#7a5320" stroke-width="1"/></symbol>
    <symbol id="i-devback" viewBox="0 0 32 32"><rect x="7" y="4" width="18" height="24" rx="3" fill="#5b3f8c" stroke="#2c1d48" stroke-width="1.5"/><polygon points="16,9 18,14 23,14 19,17 20.5,22 16,19 11.5,22 13,17 9,14 14,14" fill="#f5d26b"/></symbol>
    <symbol id="i-knight-s" viewBox="0 0 32 32"><path d="M16 3 L27 7 V15 C27 22 22 27 16 29 C10 27 5 22 5 15 V7 Z" fill="#b8c4d6" stroke="#4a5568" stroke-width="1.5"/><path d="M16 8 V24 M10 14 H22" stroke="#c2412d" stroke-width="3"/></symbol>
    <symbol id="i-road-s" viewBox="0 0 32 32"><rect x="3" y="12" width="26" height="8" rx="3" fill="#b98a55" stroke="#5a3b1c" stroke-width="1.5" transform="rotate(-25 16 16)"/></symbol>

    <!-- 发展卡图标 -->
    <symbol id="d-knight" viewBox="0 0 32 32"><path d="M16 3 L27 7 V15 C27 22 22 27 16 29 C10 27 5 22 5 15 V7 Z" fill="#c9d3e2" stroke="#3a4558" stroke-width="1.5"/><path d="M16 8 V24 M10 14 H22" stroke="#b5342a" stroke-width="3.2"/></symbol>
    <symbol id="d-vp" viewBox="0 0 32 32"><path d="M5 22 L7 9 L12 15 L16 6 L20 15 L25 9 L27 22 Z" fill="#f5d26b" stroke="#8a6a1f" stroke-width="1.5" stroke-linejoin="round"/><rect x="5" y="22" width="22" height="4" rx="1" fill="#e0a93b" stroke="#8a6a1f" stroke-width="1.2"/><circle cx="16" cy="18" r="2" fill="#c2412d"/></symbol>
    <symbol id="d-road" viewBox="0 0 32 32"><path d="M4 26 L12 6 M28 26 L20 6" stroke="#6b4a2a" stroke-width="2.4" fill="none"/><path d="M8 26 L14 6 H18 L24 26 Z" fill="#c9a06a"/><path d="M16 9 V12 M16 15 V18 M16 21 V24" stroke="#fff6dc" stroke-width="1.8"/></symbol>
    <symbol id="d-plenty" viewBox="0 0 32 32"><path d="M4 12 C10 30 26 28 28 14 C22 18 12 18 4 12 Z" fill="#d6a04a" stroke="#7a5320" stroke-width="1.4"/><circle cx="12" cy="10" r="3.5" fill="#d64545"/><circle cx="18" cy="8" r="3.2" fill="#f2c94c"/><circle cx="23" cy="11" r="3" fill="#6fae4a"/></symbol>
    <symbol id="d-monopoly" viewBox="0 0 32 32"><path d="M10 9 C8 5 24 5 22 9 C28 14 29 27 16 28 C3 27 4 14 10 9 Z" fill="#c69a3e" stroke="#6e4f17" stroke-width="1.5"/><path d="M10 9 H22" stroke="#6e4f17" stroke-width="2"/><text x="16" y="23" font-size="11" font-weight="700" text-anchor="middle" fill="#fff4cf">¤</text></symbol>
  </defs>
</svg>

<!-- ============ 首页 ============ -->
<section id="screen-home" class="screen" hidden>
  <div class="home-sea" aria-hidden="true"><svg id="demo-board" class="board-svg demo"></svg></div>
  <header class="home-title">
    <h1>卡坦岛</h1>
    <p>开拓、交易、建造。和朋友在同一座岛上争夺 10 分。</p>
  </header>
  <aside class="ledger">
    <label class="field"><span>你的名字</span><input id="name" maxlength="16" autocomplete="nickname"></label>

    <div class="block">
      <h2>开一座新岛</h2>
      <div class="size-pick" id="size-pick" role="group" aria-label="地图人数">
        <button data-size="4" aria-pressed="true"><b>4 人</b><small>经典 19 块</small></button>
        <button data-size="6" aria-pressed="false"><b>6 人</b><small>扩展 30 块</small></button>
        <button data-size="8" aria-pressed="false"><b>8 人</b><small>大岛 43 块</small></button>
      </div>
      <div class="opts">
        <label>目标分数 <select id="opt-vp"><option>8</option><option selected>10</option><option>12</option><option>14</option></select></label>
        <label><input type="checkbox" id="opt-special"> 特殊建造阶段</label>
        <label><input type="checkbox" id="opt-private"> 不在大厅公开</label>
      </div>
      <button class="btn primary wide" id="btn-create">创建房间</button>
    </div>

    <div class="block">
      <h2>加入朋友的房间</h2>
      <div class="join-row"><input id="join-code" maxlength="5" placeholder="房间号，如 K7Q2M" autocapitalize="characters" aria-label="房间号"><button class="btn" id="btn-join">加入</button></div>
    </div>

    <div class="block grow">
      <div class="block-head"><h2>正在进行</h2><button class="mini ghost" id="btn-refresh">刷新</button></div>
      <div id="room-list" class="room-list"><p class="empty">正在连接服务器…</p></div>
    </div>
  </aside>
</section>

<!-- ============ 房间大厅 ============ -->
<section id="screen-lobby" class="screen" hidden>
  <div class="lobby">
    <header class="lobby-head">
      <div>
        <h1 id="lobby-title">房间</h1>
        <p class="muted">房间号 <b id="lobby-code" class="code"></b></p>
      </div>
      <button class="btn ghost" id="btn-leave-lobby">离开</button>
    </header>
    <div class="lobby-grid">
      <div class="panel">
        <div class="block-head"><h2>玩家</h2><span id="lobby-count" class="muted"></span></div>
        <ul id="lobby-players" class="slots"></ul>
        <div class="colors-row"><span class="muted">你的颜色</span><div id="lobby-colors" class="swatches"></div></div>
        <div class="lobby-actions">
          <button class="btn" id="btn-addbot">添加电脑玩家</button>
          <button class="btn primary" id="btn-start">开始游戏</button>
          <p id="lobby-wait" class="muted"></p>
        </div>
      </div>
      <div class="panel">
        <h2>邀请朋友</h2>
        <div class="join-row"><input id="lobby-link" readonly aria-label="邀请链接"><button class="btn" id="btn-copy">复制链接</button></div>
        <h2>地图</h2>
        <div id="lobby-size" class="size-pick"></div>
        <div class="opts">
          <label>目标分数 <select id="lobby-vp"><option>8</option><option>10</option><option>12</option><option>14</option></select></label>
          <label><input type="checkbox" id="lobby-special"> 特殊建造阶段</label>
        </div>
        <h2>聊天</h2>
        <ul id="lobby-chat-list" class="chat-list"></ul>
        <form id="lobby-chat-form" class="chat-form"><input id="lobby-chat-input" maxlength="200" placeholder="说点什么…" autocomplete="off" aria-label="聊天"><button class="btn">发送</button></form>
      </div>
    </div>
  </div>
</section>

<!-- ============ 游戏 ============ -->
<section id="screen-game" class="screen" hidden>
  <header class="topbar">
    <button class="icon-btn only-narrow" id="toggle-players" aria-label="玩家列表">☰</button>
    <span class="room-tag">房间 <b id="room-code"></b></span>
    <div id="status" class="status" aria-live="polite"></div>
    <div id="dice-mini" class="dice-mini" title="最近一次掷骰"></div>
    <div id="bank-info" class="bank-info" title="银行"></div>
    <div class="top-btns">
      <button class="icon-btn" id="btn-rules" aria-label="规则">?</button>
      <button class="icon-btn" id="btn-settings" aria-label="声音设置">♪</button>
      <button class="icon-btn only-narrow" id="toggle-side" aria-label="日志与聊天">✉<i id="drawer-badge" class="dot" hidden></i></button>
      <button class="icon-btn" id="btn-leave" aria-label="离开">⎋</button>
    </div>
  </header>

  <aside class="left"><ul id="players" class="players"></ul></aside>

  <main id="board-wrap" class="board-wrap">
    <svg id="board" class="board-svg" role="img" aria-label="卡坦岛棋盘"></svg>
    <div id="hint" class="hint" hidden></div>
    <div id="tile-tip" class="tile-tip" hidden></div>
    <div class="zoom">
      <button class="icon-btn" id="zoom-in" aria-label="放大">+</button>
      <button class="icon-btn" id="zoom-out" aria-label="缩小">−</button>
      <button class="icon-btn" id="zoom-fit" aria-label="复位">⌂</button>
    </div>
    <div id="trade-panel" class="trade-panel" hidden></div>
  </main>

  <aside class="right">
    <div class="rtabs" role="tablist">
      <button class="rtab" data-tab="log" role="tab">日志</button>
      <button class="rtab" data-tab="chat" role="tab">聊天 <i id="chat-badge" class="badge" hidden></i></button>
    </div>
    <div id="pane-log" class="pane"><ul id="log" class="log"></ul></div>
    <div id="pane-chat" class="pane" hidden>
      <ul id="chat-list" class="chat-list"></ul>
      <div class="emotes"><button class="emote">👍</button><button class="emote">😂</button><button class="emote">😱</button><button class="emote">🤝</button><button class="emote">🐑?</button><button class="emote">GG</button></div>
      <form id="chat-form" class="chat-form"><input id="chat-input" maxlength="200" placeholder="说点什么…" autocomplete="off" aria-label="聊天"><button class="btn">发送</button></form>
    </div>
  </aside>

  <footer class="dock">
    <div class="hand-wrap"><div id="hand" class="hand"></div><div id="pieces" class="pieces"></div></div>
    <div id="devhand" class="devhand"></div>
    <div id="actions" class="actions"></div>
  </footer>
</section>

<div id="modal-root"></div>
<div id="fx-layer" aria-hidden="true"></div>
<div id="toast-root" aria-live="polite"></div>
<div class="conn-lost">与服务器的连接已断开，正在重连…</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
