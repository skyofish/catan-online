<!-- ============ 首页 ============ -->
<section id="screen-home" class="screen" hidden>
  <div class="skyline" aria-hidden="true">
    <svg id="skyline" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice"></svg>
  </div>
  <header class="home-title">
    <p class="eyebrow">1770 — 1870</p>
    <h1>工业革命<span>伯明翰</span></h1>
    <p class="lede">运河与铁路的一百年。建工厂、修线路、把货卖到远方，成为英格兰中部的工业大亨。</p>
  </header>
  <aside class="ledger">
    <div class="userbar"><span class="chip me-chip"></span><b id="me-name"></b><a class="mini ghost" href="/">返回游戏大厅</a><button class="mini ghost fs-mini" type="button" data-fullscreen aria-label="全屏"></button></div>

    <button class="tutorial-cta" id="btn-tutorial" type="button">
      <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#mentor"/></svg>
      <span><b>新手教程</b><small>导师老约翰手把手带你打第一局（约 5 分钟）</small></span>
    </button>

    <div class="block">
      <h2>开设一家工厂</h2>
      <div class="opts">
        <label><input type="checkbox" id="opt-intro"> 入门短局（只玩运河时代）</label>
        <label><input type="checkbox" id="opt-private"> 不在大厅公开</label>
      </div>
      <button class="btn primary wide" id="btn-create">创建房间</button>
    </div>

    <div class="block">
      <h2>加入朋友的房间</h2>
      <div class="join-row"><input id="join-code" maxlength="5" placeholder="房间号，如 K7Q2M" autocapitalize="characters" aria-label="房间号"><button class="btn" id="btn-join">加入</button></div>
    </div>

    <div class="block grow">
      <div class="block-head">
        <div class="seg" role="tablist" aria-label="首页信息">
          <button role="tab" data-htab="rooms" aria-selected="true">正在进行</button>
          <button role="tab" data-htab="rank" aria-selected="false">排行榜</button>
          <button role="tab" data-htab="mine" aria-selected="false">我的战绩</button>
        </div>
        <button class="mini ghost" id="btn-refresh">刷新</button>
      </div>
      <div id="htab-rooms" class="htab"><div id="room-list" class="room-list"><p class="empty">正在连接服务器…</p></div></div>
      <div id="htab-rank" class="htab" hidden></div>
      <div id="htab-mine" class="htab" hidden></div>
    </div>
  </aside>
</section>

<!-- ============ 房间大厅 ============ -->
<section id="screen-lobby" class="screen" hidden>
  <div class="lobby">
    <header class="lobby-head">
      <div>
        <h1 id="lobby-title">房间</h1>
        <p class="muted">房间号 <b id="lobby-code" class="code"></b></p>
      </div>
      <div class="head-btns">
        <button class="icon-btn vb vb-spk" aria-label="扬声器"><svg viewBox="0 0 24 24"><use href="#ic-spk"/></svg></button>
        <button class="icon-btn vb vb-mic" aria-label="麦克风"><svg viewBox="0 0 24 24"><use href="#ic-mic-off"/></svg></button>
        <button class="icon-btn" type="button" data-fullscreen aria-label="全屏"></button>
        <button class="btn ghost" id="btn-leave-lobby">离开</button>
      </div>
    </header>
    <div class="lobby-grid">
      <div class="panel">
        <div class="block-head"><h2>工厂主</h2><span id="lobby-count" class="muted"></span></div>
        <ul id="lobby-players" class="slots"></ul>
        <div class="colors-row"><span class="muted">你的颜色</span><div id="lobby-colors" class="swatches"></div></div>
        <div class="bot-row" id="bot-row">
          <span class="muted">添加电脑</span>
          <button class="btn mini" data-bot="easy" title="反应慢、常犯错">学徒</button>
          <button class="btn mini" data-bot="normal" title="稳扎稳打">工头</button>
          <button class="btn mini" data-bot="hard" title="精打细算">大亨</button>
          <button class="btn mini ai-btn" data-bot="ai" title="由智谱大模型挑选行动，每步稍慢" hidden>🧠 AI 玩家</button>
        </div>
        <div class="opts">
          <label><input type="checkbox" id="lobby-intro"> 入门短局（只玩运河时代，结束时额外按现金和收入计分）</label>
        </div>
        <div class="lobby-actions">
          <button class="btn primary big" id="btn-start">开始游戏</button>
          <p id="lobby-wait" class="muted"></p>
        </div>
      </div>
      <div class="panel">
        <h2>邀请朋友</h2>
        <div class="join-row"><input id="lobby-link" readonly aria-label="邀请链接"><button class="btn" id="btn-copy">复制链接</button></div>
        <div class="block-head"><h2>邀请在线玩家</h2><span class="muted small" id="online-count"></span></div>
        <ul id="online-list" class="online-list"><li class="empty">正在获取在线玩家…</li></ul>
        <h2>聊天</h2>
        <ul id="lobby-chat-list" class="chat-list"></ul>
        <form id="lobby-chat-form" class="chat-form"><input id="lobby-chat-input" maxlength="200" placeholder="说点什么…" autocomplete="off" aria-label="聊天"><button class="btn">发送</button></form>
      </div>
    </div>
  </div>
</section>

<!-- ============ 游戏 ============ -->
<section id="screen-game" class="screen" hidden>
  <header class="topbar" id="hud">
    <button class="icon-btn only-narrow" id="toggle-players" aria-label="玩家与市场">☰</button>
    <div class="era-chip" id="era-chip"></div>
    <div id="status" class="status" aria-live="polite"></div>
    <div class="top-btns">
      <button class="icon-btn vb vb-spk" aria-label="扬声器"><svg viewBox="0 0 24 24"><use href="#ic-spk"/></svg></button>
      <button class="icon-btn vb vb-mic" aria-label="麦克风"><svg viewBox="0 0 24 24"><use href="#ic-mic-off"/></svg></button>
      <button class="icon-btn" type="button" data-fullscreen aria-label="全屏"></button>
      <button class="icon-btn" id="btn-rules" aria-label="规则">?</button>
      <button class="icon-btn" id="btn-settings" aria-label="声音设置">♪</button>
      <button class="icon-btn only-narrow" id="toggle-side" aria-label="日志与聊天">✉<i id="drawer-badge" class="dot" hidden></i></button>
      <button class="icon-btn" id="btn-leave" aria-label="离开">⎋</button>
      <button class="icon-btn only-narrow" id="btn-more" aria-label="菜单">⋯</button>
    </div>
  </header>

  <aside class="left">
    <ul id="players" class="players"></ul>
  </aside>

  <main id="board-wrap" class="board-wrap">
    <svg id="board" class="board-svg" role="img" aria-label="伯明翰地图"></svg>
    <div id="hint" class="hint" hidden></div>
    <div id="suggest" class="hint suggest" hidden></div>
    <div id="tip" class="tip" hidden></div>
    <div class="zoom">
      <button class="icon-btn" id="zoom-in" aria-label="放大">+</button>
      <button class="icon-btn" id="zoom-out" aria-label="缩小">−</button>
      <button class="icon-btn" id="zoom-fit" aria-label="复位">⌂</button>
    </div>
  </main>

  <aside class="right">
    <div class="rtabs" role="tablist">
      <button class="rtab" data-tab="log" role="tab">日志</button>
      <button class="rtab" data-tab="chat" role="tab">聊天 <i id="chat-badge" class="badge" hidden></i></button>
    </div>
    <div id="pane-log" class="pane"><ul id="log" class="log"></ul></div>
    <div id="pane-chat" class="pane" hidden>
      <ul id="chat-list" class="chat-list"></ul>
      <div class="emotes"><button class="emote">👍</button><button class="emote">😂</button><button class="emote">😱</button><button class="emote">🍺?</button><button class="emote">⛏️</button><button class="emote">GG</button></div>
      <form id="chat-form" class="chat-form"><input id="chat-input" maxlength="200" placeholder="说点什么…" autocomplete="off" aria-label="聊天"><button class="btn">发送</button></form>
    </div>
  </aside>

  <footer class="dock" id="dock">
    <div class="hand-wrap">
      <div class="hand-head"><span id="hand-title">手牌</span><button class="mini ghost" id="btn-mat"><svg viewBox="0 0 24 24"><use href="#a-mat"/></svg>产业板</button></div>
      <div id="hand" class="hand"></div>
    </div>
    <div id="actions" class="actions"></div>
  </footer>
  <div id="sheet" class="sheet" hidden></div>
</section>

<div id="invite-root" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="fx-layer" aria-hidden="true"></div>
<div id="coach-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="ticker-root" aria-live="polite"></div>
<div class="conn-lost">与服务器的连接已断开，正在重连…</div>

<script type="module" src="/brass/js/app.js"></script>
</body>
</html>
