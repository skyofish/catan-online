name: 测试并部署

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发

# 同一时间只跑一个部署，新的推送排队等待，不会打断正在进行的部署
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test # 测试不通过就不部署
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 在服务器上拉取代码并重启
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/catan' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<SCRIPT
          set -e
          cd $DEPLOY_PATH
          git fetch --quiet origin main
          git reset --hard origin/main
          ./deploy.sh
          SCRIPT
