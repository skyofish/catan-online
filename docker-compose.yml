services:
  catan:
    build: .
    image: catan-online:latest
    container_name: catan-online
    restart: unless-stopped
    ports:
      # 启用 HTTPS 时在 .env 中设置 CATAN_BIND=127.0.0.1、CATAN_PORT=3000，只对本机开放，由 Caddy 对外
      - "${CATAN_BIND:-0.0.0.0}:${CATAN_PORT:-3000}:3000"
    environment:
      - PORT=3000
      # 平台名称（显示在首页招牌和网页标题上）
      - PLATFORM_NAME=${PLATFORM_NAME:-朋友游戏厅}
      # 管理员账号密码：写在服务器的 .env 文件里，不要提交到仓库
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # 声网语音：在声网控制台创建项目后获得，同样写在 .env 里
      - AGORA_APP_ID=${AGORA_APP_ID:-}
      - AGORA_APP_CERTIFICATE=${AGORA_APP_CERTIFICATE:-}
      # 智谱 AI 玩家：API Key 写在 .env 里；模型默认免费的 glm-4.7-flash
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - ZHIPU_MODEL=${ZHIPU_MODEL:-glm-4.7-flash}
      - ZHIPU_THINKING=${ZHIPU_THINKING:-}
      - ZHIPU_BOT_ENABLED=${ZHIPU_BOT_ENABLED:-}
      - ZHIPU_API_URL=${ZHIPU_API_URL:-}
      - ZHIPU_TIMEOUT_SECONDS=${ZHIPU_TIMEOUT_SECONDS:-}
      # 经 Caddy 反向代理时，用 X-Forwarded-For 识别真实 IP（用于登录限流）
      - TRUST_PROXY=${TRUST_PROXY:-}
      # 电脑玩家每步操作间隔（毫秒）
      - BOT_DELAY_MS=900
      # 玩家掉线多久后由电脑代管（毫秒）
      - AFK_TAKEOVER_MS=60000
      # 最多同时存在的房间数
      - MAX_ROOMS=200
    volumes:
      # 数据库（账号、战绩、进行中的对局）保存在这个数据卷里，重建容器不会丢失
      - catan-data:/app/data
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # HTTPS（可选）：在 .env 中设置 COMPOSE_PROFILES=https 和 PUBLIC_IP 后启用
  caddy:
    image: caddy:2.11-alpine
    container_name: catan-caddy
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - catan
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_IP=${PUBLIC_IP:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  catan-data:
  caddy-data:
  caddy-config:
